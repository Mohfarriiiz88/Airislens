services:
  # ──────────────────────────────────────────────
  # Next.js Application
  # MySQL & Nginx sudah ada di VPS (tidak di-Docker-kan)
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airislens-app
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - uploads:/var/lib/airislens/uploads
    ports:
      # Hanya expose ke localhost VPS, Nginx yang forward ke sini
      - "127.0.0.1:3000:3000"
    extra_hosts:
      # Agar container bisa akses MySQL di host VPS
      - "host.docker.internal:host-gateway"

volumes:
  uploads:
    driver: local
