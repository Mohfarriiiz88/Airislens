services:
  # ──────────────────────────────────────────────
  # MySQL Database
  # ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: airislens-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Auto-run SQL init files on first start
      - ./database/ddl:/docker-entrypoint-initdb.d:ro
    networks:
      - airislens-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────
  # Next.js Application
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airislens-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # Override DB_HOST to use the Docker service name
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - uploads:/var/lib/airislens/uploads
    ports:
      - "3000:3000"
    networks:
      - airislens-net

  # ──────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: airislens-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certbot/conf:/etc/letsencrypt:ro
      - ./ops/certbot/www:/var/www/certbot:ro
    networks:
      - airislens-net

  # ──────────────────────────────────────────────
  # Certbot for SSL (Let's Encrypt)
  # ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: airislens-certbot
    volumes:
      - ./ops/certbot/conf:/etc/letsencrypt
      - ./ops/certbot/www:/var/www/certbot
    # Only runs when invoked manually – not a background service
    profiles:
      - certbot

volumes:
  db_data:
    driver: local
  uploads:
    driver: local

networks:
  airislens-net:
    driver: bridge
