# Nginx config untuk Docker (proxy ke container app)
# Ganti YOUR_DOMAIN.COM dengan domain Anda

server {
    listen 80;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

    # Certbot ACME challenge untuk SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP -> HTTPS setelah SSL aktif
    # Uncomment baris di bawah setelah menjalankan certbot
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Sementara (sebelum SSL): proxy langsung
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20m;
    }
}

